version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: glider-app
    user: "0:0"
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://tracker.example.com}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-glider_tracker}
      DB_USERNAME: ${DB_USERNAME:-glider}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mail.example.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-tracker@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Glider Equipment Tracker}
      ICAL_URL: ${ICAL_URL:-https://example.com/calendars/shared/ical.ics}
      ICAL_USERNAME: ${ICAL_USERNAME:-}
      ICAL_PASSWORD: ${ICAL_PASSWORD:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - /volume1/docker/glider-tracker/public:/var/www/html/public
      - /volume1/docker/glider-tracker/src:/var/www/html/src
      - /volume1/docker/glider-tracker/config:/var/www/html/config
      - /volume1/docker/glider-tracker/storage:/var/www/html/storage
      - /volume1/docker/glider-tracker/database:/var/www/html/database
    depends_on:
      - db
      - redis
    networks:
      - glider-network

  nginx:
    image: nginx:1.27-alpine
    container_name: glider-nginx
    restart: unless-stopped
    ports:
      - "8282:80"
    volumes:
      - /volume1/docker/glider-tracker/public:/var/www/html/public:ro
      - /volume1/docker/glider-tracker/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - glider-network

  db:
    image: mariadb:11.4
    container_name: glider-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-glider_tracker}
      MYSQL_USER: ${DB_USERNAME:-glider}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - /volume1/docker/glider-tracker/mysql:/var/lib/mysql
      - /volume1/docker/glider-tracker/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - glider-network

  redis:
    image: redis:7-alpine
    container_name: glider-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /volume1/docker/glider-tracker/redis:/data
    networks:
      - glider-network

networks:
  glider-network:
    driver: bridge
