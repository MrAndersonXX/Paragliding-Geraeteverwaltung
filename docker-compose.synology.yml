# Synology DS920+ / Container Manager deployment.
#
# Pulls pre-built images from the GitHub Container Registry (published by
# .github/workflows/docker-publish.yml) - no repository checkout, build step,
# or manual folder/permission setup is required on the NAS. Only this single
# file needs to exist in the Container Manager project folder. Only the
# persistent data (JSON records, uploaded documents, equipment images) lives
# in a named Docker volume that Container Manager creates and manages itself.
#
# If you cannot pull from ghcr.io (private fork, no internet egress), use
# docker-compose.synology.build.yml instead, which builds the images locally
# from the checked-out repository.
services:
  app:
    image: ghcr.io/mrandersonxx/paragliding-geraeteverwaltung-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      TZ: Europe/Berlin
    volumes:
      - glider_storage:/var/www/html/storage

  nginx:
    image: ghcr.io/mrandersonxx/paragliding-geraeteverwaltung-nginx:latest
    restart: unless-stopped
    ports:
      - "8282:80"
    depends_on:
      - app

volumes:
  glider_storage:
