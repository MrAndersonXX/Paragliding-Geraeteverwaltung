# Synology / Dockhand deployment.
#
# Pulls pre-built app and nginx images from GitHub Container Registry. The NAS
# only needs this Compose file and the ./data folder. All mutable application
# data is stored below ./data and mounted into the app as /var/www/html/storage.
services:
  app:
    image: ghcr.io/mrandersonxx/paragliding-geraeteverwaltung-app:0.8.0
    pull_policy: always
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/var/www/html/storage

  nginx:
    image: ghcr.io/mrandersonxx/paragliding-geraeteverwaltung-nginx:0.8.0
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8282:80"
    depends_on:
      - app
