# Synology / local development deployment.
#
# Builds the app locally from the checked-out source and keeps the development
# storage folder separate from the production data folder in ../glider-manager.
# The app is served on port 8383.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./config:/var/www/html/config
      - ./storage:/var/www/html/storage

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8383:80"
    volumes:
      - ./public:/var/www/html/public:ro
    depends_on:
      - app