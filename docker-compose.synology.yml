# Synology DS920+ / Container Manager deployment.
#
# Builds both images directly from the GitHub repository's main branch. The
# Synology needs internet access to GitHub, Composer, and unicode.org during
# the build. Only the persistent data (JSON records, uploaded documents,
# equipment images) lives in a named Docker volume managed by Docker.
#
# This requires a recent Docker Compose / BuildKit version that supports Git
# URLs as build contexts. For older Container Manager versions, use
# docker-compose.synology.build.yml with a local repository checkout instead.
services:
  app:
    build:
      context: "https://github.com/MrAndersonXX/Paragliding-Geraeteverwaltung.git#main"
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      TZ: Europe/Berlin
    volumes:
      - glider_storage:/var/www/html/storage

  nginx:
    build:
      context: "https://github.com/MrAndersonXX/Paragliding-Geraeteverwaltung.git#main"
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8282:80"
    depends_on:
      - app

volumes:
  glider_storage:
